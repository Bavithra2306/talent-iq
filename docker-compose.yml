services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: talent-iq-auth:dev
    container_name: talent-iq-auth-dev
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: talent-iq-postgres
    env_file:
      - .env.postgres
    ports:
      - "5433:5432"
    volumes:
      - talent_iq_pgdata:/var/lib/postgresql
    restart: unless-stopped

volumes:
  talent_iq_pgdata:
    external: true