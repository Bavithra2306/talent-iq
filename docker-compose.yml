
services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: talent-iq-auth:dev
    container_name: talent-iq-auth-dev
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:18
    container_name: talent-iq-postgres
    env_file:
      - .env.postgres
    ports:
      - "5433:5432"
    volumes:
      - talent_iq_pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../talent-iq-frontend
      dockerfile: Dockerfile
    image: talent-iq-frontend:dev
    container_name: talent-iq-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy

volumes:
  talent_iq_pgdata:
    external: true
